databases:
  - name: mdcat-database
    databaseName: mdcat
    user: mdcat
    plan: free

services:
  - type: web
    name: mdcat-backend
    runtime: python
    plan: free
    rootDir: mdcat_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: mdcat-database
          property: connectionString
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "20"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_MODEL
        value: command-a-plus-05-2026
      - key: OLLAMA_API_URL
        sync: false
      - key: OLLAMA_MODEL
        value: llama3.1:8b
      - key: OLLAMA_API_TOKEN
        sync: false
      - key: QUESTION_PROVIDER_CONCURRENCY
        # One generation at a time avoids exhausting free-tier provider
        # rate limits when background question-bank refills are running.
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_2_EMAIL
        sync: false
      - key: ADMIN_2_PASSWORD
        sync: false
      - key: ADMIN_2_USERNAME
        value: admin2
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: EMAIL_FROM_NAME
        value: Exam Preparation
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: NOTIFICATION_CRON_SECRET
        generateValue: true
      - key: JAZZCASH_MERCHANT_ID
        sync: false
      - key: JAZZCASH_PASSWORD
        sync: false
      - key: JAZZCASH_INTEGRITY_SALT
        sync: false
