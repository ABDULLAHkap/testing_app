name: mdcat_app
description: Multi-exam preparation mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.2
  fl_chart: ^0.69.0
  provider: ^6.1.2
  intl: ^0.19.0
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
