name: Backend CI

on:
  push:
    paths:
      - "mdcat_backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "mdcat_backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mdcat_backend
    env:
      JWT_SECRET_KEY: ci-only-secret-that-is-never-used-in-production
      GROQ_API_KEY: ci-only-placeholder
      DATABASE_URL: sqlite:///./ci-test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mdcat_backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m unittest discover -s tests -v
      - run: python -c "from app.main import app; assert app.title == 'MDCAT AI Preparation API'"
