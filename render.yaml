databases:
  - name: mdcat-database
    databaseName: mdcat
    user: mdcat
    plan: free

services:
  - type: web
    name: mdcat-backend
    runtime: python
    plan: free
    rootDir: mdcat_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: mdcat-database
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_EMAIL
        value: choudrymnouman@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_2_EMAIL
        sync: false
      - key: ADMIN_2_PASSWORD
        sync: false
      - key: ADMIN_2_USERNAME
        value: admin2
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_NAME
        value: AI Exam Preparation
      - key: JAZZCASH_MERCHANT_ID
        sync: false
      - key: JAZZCASH_PASSWORD
        sync: false
      - key: JAZZCASH_INTEGRITY_SALT
        sync: false
