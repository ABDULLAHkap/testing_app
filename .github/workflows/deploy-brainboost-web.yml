name: Deploy BrainBoost Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mdcat_app/**"
      - ".github/workflows/deploy-brainboost-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "brainboost-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mdcat_app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build BrainBoost web app
        run: >-
          flutter build web --release --base-href /testing_app/
          --dart-define=API_BASE_URL=https://mdcat-backend.onrender.com

      - name: Upload Pages package
        uses: actions/upload-pages-artifact@v3
        with:
          path: mdcat_app/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
