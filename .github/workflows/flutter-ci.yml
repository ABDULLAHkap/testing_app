name: Flutter CI

on:
  push:
    paths:
      - "mdcat_app/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "mdcat_app/**"
      - ".github/workflows/flutter-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mdcat_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build web --release --dart-define=API_BASE_URL=https://example.invalid
