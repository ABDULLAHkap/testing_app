name: Build BrainBoost Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mdcat_app/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mdcat_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: test -n "$API_BASE_URL"
      - run: flutter pub get
      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Rename BrainBoost APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BrainBoost.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BrainBoost-android-apk
          path: mdcat_app/build/app/outputs/flutter-apk/BrainBoost.apk
          if-no-files-found: error
